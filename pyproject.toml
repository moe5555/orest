[project]
name = "orest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cyndilib>=0.1.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
    "orest-pose",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pygrabber>=0.2",
    "python-osc>=1.10.2",
    # Loads the RTMO pose model orest_pose runs. Declared here rather than in
    # orest_pose, which stays dependency-free so that installing it into WISE's
    # conda environment cannot re-resolve that environment's pinned stack.
    "rtmlib>=0.0.16",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
orest-sitrep = "sitrep.main:main"
orest-search = "smartsearch.main:main"
orest-ui = "interface.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitrep", "src/smartsearch", "src/face", "src/osc", "src/interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# rtmlib asks for opencv-contrib-python, which ships its own cv2 and collides
# with the opencv-python this project pins. The marker is never satisfiable,
# which drops the request while leaving the rest of rtmlib's resolution intact.
override-dependencies = ["opencv-contrib-python; python_version < '3'"]

[tool.uv.workspace]
members = [
    "wise_ext",
]

[tool.uv.sources]
orest-pose = { workspace = true, editable = true }
