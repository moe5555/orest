[project]
name = "orest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
    "orest-pose",
    "pydantic>=2.13.5",
    "pygrabber>=0.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
orest-sitrep = "sitrep.main:main"
orest-search = "smartsearch.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitrep", "src/smartsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "wise_ext",
]

[tool.uv.sources]
orest-pose = { workspace = true, editable = true }
