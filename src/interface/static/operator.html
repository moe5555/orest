<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apollon</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="operator">
  <main class="operator-card">
    <h1 class="wordmark">APOLLON</h1>
    <span class="label">Operator</span>
    <div class="sources">
      <label class="field">
        <span class="label">Kamera</span>
        <select id="camera" disabled><option>Wird geladen …</option></select>
      </label>
      <label class="field">
        <span class="label">Ton</span>
        <select id="sound" disabled><option>Wird geladen …</option></select>
      </label>
      <p class="notice" id="notice" role="status"></p>
    </div>
    <a class="button primary" href="/sitrep" target="_blank" rel="noopener">
      <span class="dot" aria-hidden="true"></span>Start live SITREP
    </a>
  </main>
  <script src="/static/operator.js"></script>
</body>
</html>
