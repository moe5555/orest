# Scenes of the live SITREP ("Scene Configurations" in
# knowledge/components/02_processing.md), read by scenes.py.
#
# Each table is one scene, offered on the start page under its name. A scene
# lists only what differs from the defaults, which apply to "Standard":
#
#   interference = true          Einschreiten when the alarm is raised
#   tracked = 4                  bodies boxed, named and judged on the Podest
#   values = ["risiko", "menschlichkeit", "berechenbarkeit"]
#   values_per_person.<Name> = [...]   for whom the values differ
#   bodies = true                bodies with no character's name rated too, with
#                                `values`, shown above their heads; off unless given
#   podest = { step = 1, floor = 2 }   the Podest count; off unless given
#   body_count = true            the number of bodies tracked sent to Max as
#                                /apollon/tracking/bodyCount; off unless given
#   video = "data/scenes/clip.mp4"     pre-recorded video, from the repository root
#   prerecorded = false          play the video from the start of the scene
#   roles = { Lena = "Elektra" }       the part a cast member plays, by the name
#                                      they are enrolled under (data/cast)
#   roles = { Lena = ["Elektra", "Klytaimnestra"] }   several parts in order: the
#                                first, then a later one once a body is named so
#                                on the SITREP page (Im Bild)
#
# With roles, people are shown, rated and reported under their part, and
# values_per_person and keys name them by it; a cast member given no part is
# shown as an unnamed body. Without roles, everyone goes by their own name.
#
# Keys, one lower-case letter or digit each (R, E, X and N are taken; N
# switches the new-body pulse to Max off and on in every scene):
#
#   keys.t = { screen = "TEXT" }                            open/close a page reading TEXT
#   keys.t = { strobe = true }                              open/close the stroboscope page
#   keys.s = { black = true }                               cut the open stroboscope to black (needs strobe)
#   keys.l = { outline = true }                             hide/show the line around the Podest (needs podest)
#   keys.p = { tracked = 3 }                                switch to 3 people tracked and back
#   keys.w = { person = "Orestes", value = "aggression", step = 1 }   raise a manual value
#   keys.c = { swap = true }                                live feed <-> video
#
# The page must be restarted (apollon-ui) to read changes to this file.

["Szene 1 - Waechter"]
interference = false
roles = { Lena = "Wächter" }
podest = { step = 1, floor = 2 }
tracked = 30
bodies = true
body_count = true
keys.t = { strobe = true }
keys.s = { black = true }
keys.l = { outline = true }
keys.p = { tracked = 3 }

["Szene 1.2"]
interference = false
roles = { Lena = "Elektra", Alex = "Orestes" }
prerecorded = true
# video = "data/scenes/szene_1_2.mp4"

["Szene 2.3 - Aggression"]
interference = false
roles = { Lena = "Elektra", Alex = "Orestes" }
values_per_person.Orestes = ["aggression"]
keys.w = { person = "Orestes", value = "aggression", step = 1 }
keys.s = { person = "Orestes", value = "aggression", step = -1 }
keys.m = { screen = "Maximales Aggressionspotenzial erreicht." }

["Szene 3 - Pylades"]
interference = false
roles = { Lena = "Klytaimnestra", Alex = "Orestes" }
keys.c = { swap = true }
# video = "data/scenes/szene_3.mp4"
