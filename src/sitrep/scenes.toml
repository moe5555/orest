# Scenes of the live SITREP ("Scene Configurations" in
# knowledge/components/02_processing.md), read by scenes.py.
#
# Each table is one scene, offered on the start page under its name. A scene
# lists only what differs from the defaults, which apply to "Standard":
#
#   interference = true          Einschreiten when the alarm is raised
#   tracked = 4                  bodies boxed, named and judged on the Podest
#   values = ["risiko", "menschlichkeit", "vorhersehbarkeit"]
#   values_per_person.<Name> = [...]   for whom the values differ
#   podest = { step = 1, floor = 2 }   the Podest count; off unless given
#   video = "data/scenes/clip.mp4"     pre-recorded video, from the repository root
#   prerecorded = false          play the video from the start of the scene
#
# Keys, one lower-case letter or digit each (R, E and X are taken):
#
#   keys.t = { screen = "TEXT" }                            open/close a page reading TEXT
#   keys.p = { tracked = 3 }                                switch to 3 people tracked and back
#   keys.w = { person = "Alex", value = "aggression", step = 1 }   raise a manual value
#   keys.c = { swap = true }                                live feed <-> video
#
# The page must be restarted (apollon-ui) to read changes to this file.

["Szene 1"]
podest = { step = 1, floor = 2 }
tracked = 30
keys.t = { screen = "TROJA IST GEFALLEN" }
keys.p = { tracked = 3 }

["Szene 1.2"]
prerecorded = true
# video = "data/scenes/szene_1_2.mp4"

["Szene 2.3"]
values_per_person.Alex = ["aggression"]
keys.w = { person = "Alex", value = "aggression", step = 1 }
keys.s = { person = "Alex", value = "aggression", step = -1 }
keys.m = { screen = "Maximales Aggressionspotenzial erreicht." }

["Szene 3"]
keys.c = { swap = true }
# video = "data/scenes/szene_3.mp4"
